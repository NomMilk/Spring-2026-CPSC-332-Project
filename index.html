<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandTheftDeals</title>
    <link rel="stylesheet" href="css/global.css">
</head>

<body>

    <header>
    <nav>
        <ul class="nav-buttons">
            <li><a href="index.html"><button>Home</button></a></li>
            <li><a href="account.html"><button>Account</button></a></li>
            <li><a href="services.html"><button>Services</button></a></li>
            <li><a href="contacts.html"><button>Contacts</button></a></li>

            <li>
                <input id="zip-input" type="text" placeholder="Search By Zip..." maxlength="10">
            </li>
        </ul>

        <img src="images/GrandTheftDeals.png" alt="Grand Theft Deals" width="200">
    </nav>
    </header>

    <!-- Filter button sits directly below the nav / Home button -->
    <div class="listing-toolbar">
        <button class="filter-btn" onclick="toggleFilter()">&#9776; Filter</button>
    </div>

    <div class="MainPageBanner"></div>

    <section id="vehicles-section">
        <p id="vehicles-count" class="vehicles-count"></p>
        <div id="vehicles-grid"></div>
    </section>

    <!-- ── Filter Panel ── -->
    <aside id="filter-panel" class="filter-panel" aria-label="Filter Vehicles">

        <div class="filter-header">
            <span class="filter-title">Filter</span>
            <button class="filter-close" onclick="toggleFilter()" aria-label="Close">&#10005;</button>
        </div>

        <div class="filter-body">

            <!-- Brand -->
            <div class="filter-section">
                <div class="filter-section-title">Brand</div>
                <div class="filter-check-grid">
                    <label class="filter-check"><input type="checkbox"> Toyota</label>
                    <label class="filter-check"><input type="checkbox"> Honda</label>
                    <label class="filter-check"><input type="checkbox"> Ford</label>
                    <label class="filter-check"><input type="checkbox"> Chevrolet</label>
                    <label class="filter-check"><input type="checkbox"> BMW</label>
                    <label class="filter-check"><input type="checkbox"> Mercedes</label>
                    <label class="filter-check"><input type="checkbox"> Audi</label>
                    <label class="filter-check"><input type="checkbox"> Nissan</label>
                    <label class="filter-check"><input type="checkbox"> Hyundai</label>
                    <label class="filter-check"><input type="checkbox"> Kia</label>
                    <label class="filter-check"><input type="checkbox"> Volkswagen</label>
                    <label class="filter-check"><input type="checkbox"> Subaru</label>
                    <label class="filter-check"><input type="checkbox"> Mazda</label>
                    <label class="filter-check"><input type="checkbox"> Jeep</label>
                    <label class="filter-check"><input type="checkbox"> Dodge</label>
                    <label class="filter-check"><input type="checkbox"> Ram</label>
                    <label class="filter-check"><input type="checkbox"> Lexus</label>
                    <label class="filter-check"><input type="checkbox"> Acura</label>
                    <label class="filter-check"><input type="checkbox"> GMC</label>
                    <label class="filter-check"><input type="checkbox"> Cadillac</label>
                    <label class="filter-check"><input type="checkbox"> Volvo</label>
                    <label class="filter-check"><input type="checkbox"> Porsche</label>
                    <label class="filter-check"><input type="checkbox"> Tesla</label>
                    <label class="filter-check"><input type="checkbox"> Infiniti</label>
                </div>
            </div>

            <!-- Model -->
            <div class="filter-section">
                <div class="filter-section-title">Model</div>
                <div class="filter-field">
                    <input type="text" class="filter-input" placeholder="e.g. Mustang">
                </div>
            </div>

            <!-- Year -->
            <div class="filter-section">
                <div class="filter-section-title">Year</div>
                <div class="filter-field">
                    <label>Min</label>
                    <div class="filter-stepper">
                        <button class="stepper-btn" onclick="stepValue('year-min', -1)">&#8722;</button>
                        <input id="year-min" type="number" class="stepper-input" min="1900" max="2026" step="1">
                        <button class="stepper-btn" onclick="stepValue('year-min', 1)">+</button>
                    </div>
                </div>
                <div class="filter-field">
                    <label>Max</label>
                    <div class="filter-stepper">
                        <button class="stepper-btn" onclick="stepValue('year-max', -1)">&#8722;</button>
                        <input id="year-max" type="number" class="stepper-input" min="1900" max="2026" step="1">
                        <button class="stepper-btn" onclick="stepValue('year-max', 1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Price -->
            <div class="filter-section">
                <div class="filter-section-title">Price ($)</div>
                <div class="filter-field">
                    <label>Min</label>
                    <div class="filter-stepper">
                        <button class="stepper-btn" onclick="stepValue('price-min', -1)">&#8722;</button>
                        <input id="price-min" type="number" class="stepper-input" min="0" step="500">
                        <button class="stepper-btn" onclick="stepValue('price-min', 1)">+</button>
                    </div>
                </div>
                <div class="filter-field">
                    <label>Max</label>
                    <div class="filter-stepper">
                        <button class="stepper-btn" onclick="stepValue('price-max', -1)">&#8722;</button>
                        <input id="price-max" type="number" class="stepper-input" min="0" step="500">
                        <button class="stepper-btn" onclick="stepValue('price-max', 1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Mileage -->
            <div class="filter-section">
                <div class="filter-section-title">Mileage</div>
                <div class="filter-field">
                    <label>Max</label>
                    <div class="filter-stepper">
                        <button class="stepper-btn" onclick="stepValue('mileage-max', -1)">&#8722;</button>
                        <input id="mileage-max" type="number" class="stepper-input" min="0" step="1000">
                        <button class="stepper-btn" onclick="stepValue('mileage-max', 1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Exterior Color -->
            <div class="filter-section">
                <div class="filter-section-title">Exterior Color</div>
                <div class="filter-check-grid">
                    <label class="filter-check"><input type="checkbox"> White</label>
                    <label class="filter-check"><input type="checkbox"> Black</label>
                    <label class="filter-check"><input type="checkbox"> Silver</label>
                    <label class="filter-check"><input type="checkbox"> Gray</label>
                    <label class="filter-check"><input type="checkbox"> Red</label>
                    <label class="filter-check"><input type="checkbox"> Blue</label>
                    <label class="filter-check"><input type="checkbox"> Navy</label>
                    <label class="filter-check"><input type="checkbox"> Green</label>
                    <label class="filter-check"><input type="checkbox"> Brown</label>
                    <label class="filter-check"><input type="checkbox"> Orange</label>
                    <label class="filter-check"><input type="checkbox"> Yellow</label>
                    <label class="filter-check"><input type="checkbox"> Beige</label>
                </div>
            </div>

            <!-- Interior Color -->
            <div class="filter-section">
                <div class="filter-section-title">Interior Color</div>
                <div class="filter-check-grid">
                    <label class="filter-check"><input type="checkbox"> Black</label>
                    <label class="filter-check"><input type="checkbox"> Beige</label>
                    <label class="filter-check"><input type="checkbox"> Gray</label>
                    <label class="filter-check"><input type="checkbox"> Brown</label>
                    <label class="filter-check"><input type="checkbox"> Tan</label>
                    <label class="filter-check"><input type="checkbox"> Red</label>
                    <label class="filter-check"><input type="checkbox"> White</label>
                    <label class="filter-check"><input type="checkbox"> Navy</label>
                </div>
            </div>

            <!-- Seating -->
            <div class="filter-section">
                <div class="filter-section-title">Seating Capacity</div>
                <div class="filter-field">
                    <label>Min Seats</label>
                    <input type="number" class="filter-input" placeholder="e.g. 5" min="1" max="15">
                </div>
            </div>

            <!-- Condition -->
            <div class="filter-section">
                <div class="filter-section-title">Condition</div>
                <label class="filter-check"><input type="checkbox"> Certified Pre-Owned</label>
                <label class="filter-check"><input type="checkbox"> No Accidents</label>
                <label class="filter-check"><input type="checkbox"> Clean Title</label>
                <label class="filter-check"><input type="checkbox"> One Owner</label>
            </div>

            <!-- Body Style -->
            <div class="filter-section">
                <div class="filter-section-title">Body Style</div>
                <label class="filter-check"><input type="checkbox"> Sedan</label>
                <label class="filter-check"><input type="checkbox"> SUV</label>
                <label class="filter-check"><input type="checkbox"> Truck</label>
                <label class="filter-check"><input type="checkbox"> Van</label>
                <label class="filter-check"><input type="checkbox"> Coupe</label>
                <label class="filter-check"><input type="checkbox"> Hatchback</label>
            </div>

            <!-- Fuel Type -->
            <div class="filter-section">
                <div class="filter-section-title">Fuel Type</div>
                <label class="filter-check"><input type="checkbox"> EV</label>
                <label class="filter-check"><input type="checkbox"> PHEV</label>
                <label class="filter-check"><input type="checkbox"> Hybrid</label>
                <label class="filter-check"><input type="checkbox"> Gas</label>
                <label class="filter-check"><input type="checkbox"> Diesel</label>
                <label class="filter-check"><input type="checkbox"> Hydrogen</label>
            </div>

            <!-- Transmission -->
            <div class="filter-section">
                <div class="filter-section-title">Transmission</div>
                <label class="filter-check"><input type="checkbox"> Automatic</label>
                <label class="filter-check"><input type="checkbox"> CVT</label>
                <label class="filter-check"><input type="checkbox"> Manual</label>
            </div>

            <!-- Drivetrain -->
            <div class="filter-section">
                <div class="filter-section-title">Drivetrain</div>
                <label class="filter-check"><input type="checkbox"> 4WD</label>
                <label class="filter-check"><input type="checkbox"> AWD</label>
                <label class="filter-check"><input type="checkbox"> FWD</label>
                <label class="filter-check"><input type="checkbox"> RWD</label>
            </div>

            <!-- MPG -->
            <div class="filter-section">
                <div class="filter-section-title">
                    MPG <span class="filter-subtitle">Gas / Hybrid</span>
                </div>
                <div class="filter-field">
                    <label>Min MPG</label>
                    <input type="number" class="filter-input" placeholder="e.g. 25" min="1">
                </div>
            </div>

            <!-- EV Range -->
            <div class="filter-section">
                <div class="filter-section-title">
                    Range <span class="filter-subtitle">Electric</span>
                </div>
                <div class="filter-field">
                    <label>Min Range (mi)</label>
                    <input type="number" class="filter-input" placeholder="e.g. 200" min="1">
                </div>
            </div>

            <!-- Features -->
            <div class="filter-section">
                <div class="filter-section-title">Features</div>
                <label class="filter-check"><input type="checkbox"> Backup Camera</label>
                <label class="filter-check"><input type="checkbox"> Navigation</label>
                <label class="filter-check"><input type="checkbox"> Moonroof</label>
                <label class="filter-check"><input type="checkbox"> Parking Sensors</label>
                <label class="filter-check"><input type="checkbox"> Third Row Seating</label>
                <label class="filter-check"><input type="checkbox"> Tow Hitch</label>
            </div>

            <!-- Actions -->
            <div class="filter-actions">
                <button class="filter-apply" onclick="applyFilters()">Apply Filters</button>
                <button class="filter-clear" onclick="clearFilters()">Clear All</button>
            </div>

        </div>
    </aside>

    <script>
        function toggleFilter() {
            document.getElementById('filter-panel').classList.toggle('open');
        }

        function stepValue(id, direction) {
            const input = document.getElementById(id);
            const step  = parseFloat(input.step)  || 1;
            const min   = input.min !== '' ? parseFloat(input.min) : 0;
            const max   = input.max !== '' ? parseFloat(input.max) : Infinity;
            let current = parseFloat(input.value);
            if (isNaN(current)) current = direction > 0 ? min : max;
            else current = Math.min(max, Math.max(min, current + direction * step));
            input.value = current;
        }

        window.addEventListener('resize', function () {
            if (window.innerWidth <= 480) {
                document.getElementById('filter-panel').classList.remove('open');
            }
        });

        document.getElementById('zip-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') loadVehicles(buildFilterParams());
        });

        function applyFilters() {
            loadVehicles(buildFilterParams());
            toggleFilter();
        }

        function clearFilters() {
            const panel = document.getElementById('filter-panel');
            panel.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            panel.querySelectorAll('input[type="text"]').forEach(inp => inp.value = '');
            panel.querySelectorAll('.stepper-input, .filter-input[type="number"]').forEach(inp => inp.value = '');
        }

        // ── Filter helpers ──

        function getSectionChecked(titleStartsWith) {
            for (const section of document.querySelectorAll('#filter-panel .filter-section')) {
                const t = section.querySelector('.filter-section-title');
                if (t && t.textContent.trim().startsWith(titleStartsWith)) {
                    return Array.from(section.querySelectorAll('input[type="checkbox"]:checked'))
                        .map(cb => cb.closest('label').textContent.trim());
                }
            }
            return [];
        }

        function getSectionNumberInput(titleStartsWith) {
            for (const section of document.querySelectorAll('#filter-panel .filter-section')) {
                const t = section.querySelector('.filter-section-title');
                if (t && t.textContent.trim().startsWith(titleStartsWith)) {
                    const inp = section.querySelector('input[type="number"].filter-input');
                    return inp ? inp.value.trim() : '';
                }
            }
            return '';
        }

        function getSectionTextInput(titleStartsWith) {
            for (const section of document.querySelectorAll('#filter-panel .filter-section')) {
                const t = section.querySelector('.filter-section-title');
                if (t && t.textContent.trim().startsWith(titleStartsWith)) {
                    const inp = section.querySelector('input[type="text"].filter-input');
                    return inp ? inp.value.trim() : '';
                }
            }
            return '';
        }

        function buildFilterParams() {
            const p = new URLSearchParams();

            getSectionChecked('Brand').forEach(v => p.append('brands[]', v));

            const model = getSectionTextInput('Model');
            if (model) p.set('model', model);

            const yearMin = document.getElementById('year-min').value;
            const yearMax = document.getElementById('year-max').value;
            if (yearMin) p.set('year_min', yearMin);
            if (yearMax) p.set('year_max', yearMax);

            const priceMin = document.getElementById('price-min').value;
            const priceMax = document.getElementById('price-max').value;
            if (priceMin) p.set('price_min', priceMin);
            if (priceMax) p.set('price_max', priceMax);

            const mileageMax = document.getElementById('mileage-max').value;
            if (mileageMax) p.set('mileage_max', mileageMax);

            getSectionChecked('Exterior Color').forEach(v => p.append('ext_colors[]', v));
            getSectionChecked('Interior Color').forEach(v => p.append('int_colors[]', v));

            const seating = getSectionNumberInput('Seating');
            if (seating) p.set('seating_min', seating);

            getSectionChecked('Condition').forEach(v => p.append('conditions[]', v));
            getSectionChecked('Body Style').forEach(v => p.append('body_styles[]', v));
            getSectionChecked('Fuel Type').forEach(v => p.append('fuel_types[]', v));
            getSectionChecked('Transmission').forEach(v => p.append('transmissions[]', v));
            getSectionChecked('Drivetrain').forEach(v => p.append('drivetrains[]', v));

            const mpg = getSectionNumberInput('MPG');
            if (mpg) p.set('mpg_min', mpg);

            const range = getSectionNumberInput('Range');
            if (range) p.set('range_min', range);

            getSectionChecked('Features').forEach(v => p.append('features[]', v));

            const zip = document.getElementById('zip-input').value.trim();
            if (zip) p.set('zip', zip);

            return p;
        }

        // ── Vehicle fetch & render ──

        function esc(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function loadVehicles(params) {
            const grid = document.getElementById('vehicles-grid');
            grid.innerHTML = '<p class="vehicles-status">Loading...</p>';
            const qs = params && params.toString() ? '?' + params.toString() : '';
            try {
                const res  = await fetch('get_vehicles.php' + qs);
                const data = await res.json();
                if (data.error) {
                    grid.innerHTML = '<p class="vehicles-status">' + esc(data.error) + '</p>';
                    return;
                }
                renderVehicles(data.vehicles || []);
            } catch {
                grid.innerHTML = '<p class="vehicles-status">Could not load vehicles.</p>';
            }
        }

        function renderVehicles(vehicles) {
            const grid  = document.getElementById('vehicles-grid');
            const count = document.getElementById('vehicles-count');
            count.textContent = 'Showing ' + vehicles.length + ' vehicle' + (vehicles.length !== 1 ? 's' : '');
            if (!vehicles.length) {
                grid.innerHTML = '<p class="vehicles-status">No vehicles match your filters.</p>';
                return;
            }

            function sepRow(parts) {
                return parts.filter(Boolean)
                    .map((s, i) => (i > 0 ? '<span class="vc-sep">·</span>' : '') + `<span>${esc(s)}</span>`)
                    .join('');
            }

            grid.innerHTML = vehicles.map(v => {
                const price   = v.price != null
                    ? '$' + Number(v.price).toLocaleString()
                    : 'Call for Price';
                const mileage = v.mileage != null
                    ? Number(v.mileage).toLocaleString() + ' mi'
                    : null;

                const specsHtml  = sepRow([mileage, v.body_style, v.fuel_type]);
                const metaHtml   = sepRow([
                    v.exterior_color ? v.exterior_color + ' Ext.' : null,
                    v.store_name || null
                ]);
                const badgesHtml = (v.conditions || [])
                    .map(c => `<span class="vehicle-badge">${esc(c)}</span>`).join('');

                return `<a class="vehicle-card-link" href="vehicle.html?vin=${encodeURIComponent(v.vin)}">
                    <div class="vehicle-card">
                        <div class="vehicle-img-placeholder">
                            <img src="${esc(v.image_url)}" alt="${esc(v.year + ' ' + v.brand + ' ' + v.model)}"
                                 onerror="this.style.display='none';this.nextElementSibling.style.display=''">
                            <span style="display:none">NO IMAGE</span>
                        </div>
                        <div class="vehicle-body">
                            <div class="vehicle-title">${esc(v.year)} ${esc(v.brand)} ${esc(v.model)}</div>
                            <div class="vehicle-price">${esc(price)}</div>
                            ${specsHtml  ? `<div class="vehicle-specs">${specsHtml}</div>`   : ''}
                            ${metaHtml   ? `<div class="vehicle-meta">${metaHtml}</div>`     : ''}
                            ${badgesHtml ? `<div class="vehicle-badges">${badgesHtml}</div>` : ''}
                        </div>
                    </div>
                </a>`;
            }).join('');
        }

        loadVehicles();
    </script>

</body>
</html>
